<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">

<title>Retouri</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#0b1d33;--mut:#566679;--line:#d5dde7;--acc:#0a4fd6;--acc-ink:#fff;--brand:#06224a;--brand2:#00a3e0;--ok:#0f8a4b;--okbg:#e2f5ea;--wait:#8a5a00;--waitbg:#fff1d2;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0b131d;--panel:#14202e;--ink:#e8eef3;--mut:#93a1ae;--line:#26354a;--acc:#4da3ff;--acc-ink:#04101f;--brand:#041326;--brand2:#2cb8ee;--ok:#46d489;--okbg:#14301f;--wait:#ffcf66;--waitbg:#3a2d0c;--bad:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header.brand{background:linear-gradient(135deg,var(--brand),#0b3a82);color:#fff;border-bottom:4px solid var(--brand2);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px}
header.brand .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}

header.brand .tt{flex:1;min-width:0}
header.brand h1{margin:0;font-size:1.6rem;letter-spacing:.02em;color:#fff}
header.brand h1 b{color:var(--brand2)}
header.brand .co{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#a9c4e8;font-weight:600}
header.brand .sub{color:#c9dcf5;margin:4px 0 0;font-size:.82rem}
header.brand button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.panel{border-top:3px solid var(--brand2)}
h2{color:var(--brand)}
@media (prefers-color-scheme:dark){h2{color:var(--brand2)}}
main{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 2px}
h2{font-size:1.15rem;margin:0 0 4px}
.sub,.mut{color:var(--mut);font-size:.9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
button,.btn{font:600 .95rem Archivo,system-ui,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}

button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
input[type=text],input[type=search],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;max-width:100%}
.grow{flex:1 1 160px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0 4px;display:flex}
.bar i{display:block;height:100%;transition:width .25s}
.b1{background:var(--ok)}.b2{background:#e0a100}
.stat{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;gap:8px;flex-wrap:wrap}
ul{list-style:none;margin:0;padding:0}
li.it{display:flex;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line)}

li.it .d2{color:var(--ink);font-size:.9rem}

li.it .n{font-size:.85rem;color:var(--wait)}
li.it.done{background:var(--okbg)}

li.it.wait{background:var(--waitbg)}
li.it.stay{background:var(--bg)}
li.it.flash{outline:3px solid var(--acc)}
.qty{font-weight:800;white-space:nowrap}
.step{display:flex;align-items:center;gap:4px}
.step .sm{margin:0;min-width:40px;min-height:40px;justify-content:center;font-size:1.1rem}
.step button:disabled{opacity:.35}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border-radius:6px;padding:1px 8px;margin:3px 4px 0 0;background:var(--waitbg);color:var(--wait)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--waitbg);color:var(--bad);display:block;margin-right:0}

.x{border:0;background:none;color:var(--mut);padding:6px;min-height:36px}
#toast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:10px;padding:10px 14px;border-radius:8px;font-weight:600;display:none}
#toast.ok{display:block;background:var(--okbg);color:var(--ok)}
#toast.err{display:block;background:var(--panel);color:var(--bad);border:1px solid var(--bad)}
video{width:100%;border-radius:8px;background:#000;max-height:50vh;object-fit:cover}
.hide{display:none}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:52px;height:52px;border-radius:26px;background:var(--brand);color:#fff;border:2px solid var(--brand2);font-size:1.4rem;justify-content:center;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}

input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box p{white-space:pre-line}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table.ov{width:100%;border-collapse:collapse;font-size:.9rem}
table.ov td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.sm{min-height:34px;padding:4px 10px;font-size:.85rem;margin:4px 6px 4px 0}
.proj{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.proj:last-child{border-bottom:0}
.proj .t{flex:1;min-width:0}
.form{display:grid;gap:10px;max-width:360px}
label.l{font-weight:600;font-size:.9rem}
.usr{padding:12px 0;border-bottom:1px solid var(--line)}
.usr:last-child{border-bottom:0}
.perm{display:flex;gap:8px;align-items:center;min-height:34px}
.perm input{width:20px;height:20px;accent-color:var(--acc)}
summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header class="brand"><div class="in"><img id="logo" src="logo.png" alt="NEP The Netherlands"><div class="tt"><h1>Retour<b>i</b></h1><div class="co">NEP The Netherlands</div><p class="sub" id="who">Laden…</p></div><button id="out" class="hide">Uitloggen</button></div></header>
<button id="top" aria-label="Naar boven" type="button">↑</button>
<main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="app"></div>
</main>

<script>
(function(){var n=["logo.png","LOGO-NEP.png","LOGO-NEP.PNG","logo-nep.png","Logo.png","logo.PNG","logo.jpg","logo.jpeg","logo.JPG","logo.svg","logo.webp","nep-logo.png","NEP.png","nep.png"],i=0,im=document.getElementById("logo");
  if(!im)return;im.onerror=function(){i++;if(i<n.length)im.src=n[i]+"?v=2";else im.remove()};im.src=n[0]+"?v=2"})();
/* ===== VUL DIT IN (zie README.md) ===== */
var API_URL="https://script.google.com/macros/s/AKfycbxTRTePUvdtyvWWLOXaprklpm3C5SWaI5QVzNDsGwJcXHlQCRTZDDQLmiaJDs1bfQBc/exec"; /* de Web-app-URL van je Apps Script, eindigt op /exec */
/* ====================================== */
(function(){
var $=function(i){return document.getElementById(i)};
/* Zware onderdelen worden pas geladen als ze nodig zijn: dat maakt de start veel sneller. */
var LIBS={pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",jsqr:"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",zxing:"https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"},LP={};
function lib(n){if(LP[n])return LP[n];return LP[n]=new Promise(function(ok,no){var e=document.createElement("script");e.src=LIBS[n];e.onload=ok;e.onerror=function(){delete LP[n];no(new Error("lib "+n))};document.head.appendChild(e)})}
function idle(f){(window.requestIdleCallback||function(g){setTimeout(g,1500)})(f)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
var tt;function toast(t,k){var e=$("toast");e.textContent=t;e.className=k;clearTimeout(tt);tt=setTimeout(function(){e.className=""},3500)}
if(!API_URL){$("who").textContent="Nog niet ingesteld.";$("app").innerHTML='<div class="panel"><p>Vul bovenin <b>index.html</b> de <b>API_URL</b> in. Zie README.md.</p></div>';return}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function load_(k){try{return localStorage.getItem(k)||""}catch(e){return""}}

/* acct = ingelogd met account. owner = dat account is beheerder. Zonder account kan iemand via een deellink meedoen (mid). */
var acct=false,owner=false,my={role:"",perms:{}},uid="",sess="",mid="",plist=[],users=[],lastInvite=null,cur=null,marks={},members={},myMarks={},lastV="",pending=0,ready=false,meSig="";
var filter="all",q="",listF="",ovOpen=false;
function can(p){return owner||!!(my.perms&&my.perms[p])}
function whoText(){
  if(!acct)return;
  var n=load_("retourAcctName")||"jij";
  $("who").textContent=owner?"Ingelogd als "+n+" (beheerder). Alleen vinkjes van beheerders tellen als bevestigd.":"Ingelogd als "+n+". Jouw scans zijn zichtbaar voor de beheerder."}
function setMe(m){
  if(!m)return;
  my=m;owner=m.role==="beheerder";store("retourMe",JSON.stringify(m));
  var s=JSON.stringify(m);if(s!==meSig){if(meSig)$("app").innerHTML="";meSig=s}
  whoText()}
function ck(n){return"retourC_"+(acct?uid:mid)+"_"+n}
function cset(n,v){try{localStorage.setItem(ck(n),JSON.stringify(v))}catch(e){try{cwipe()}catch(x){}}}
function cget(n){try{var t=localStorage.getItem(ck(n));return t?JSON.parse(t):null}catch(e){return null}}
function cwipe(){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("retourC_")===0)localStorage.removeItem(k)})}catch(e){}}
function clearAuth(){cwipe();acct=false;owner=false;my={role:"",perms:{}};uid="";sess="";mid="";meSig="";lastInvite=null;
  ["retourUid","retourSess","retourMe","retourAcctName"].forEach(function(k){store(k,null)})}
function onLogin(j){
  acct=true;uid=j.uid;sess=j.session;mid="u_"+uid;store("retourUid",uid);store("retourSess",sess);store("retourAcctName",j.name);
  meSig="";setMe(j.me);go()}

/* ---------- Verbinding met het script ---------- */
function authObj(){if(acct)return{user:true,uid:uid,session:sess};var r=parseRoute();return{mid:mid,pid:r.pid,token:r.token}}
function api(action,data,noAuth){
  var body=Object.assign({action:action,auth:noAuth?null:authObj()},data||{});
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j})}
function w(action,data){pending++;
  return api(action,data).catch(function(e){console.error(e);if(e&&e.message==="auth")return handleErr(e);toast("Opslaan mislukt: "+scriptMsg(e),"err");load()}).then(function(){pending--})}
function errText(e){var m=String(e&&e.message||e);
  if(e&&e.name==="TypeError")return"Geen verbinding met het script (geblokkeerd of verkeerde URL). Technisch: "+m;
  if(e&&e.name==="SyntaxError")return"Het script geeft geen geldig antwoord. Controleer bij Implementeren: Uitvoeren als ‘Ik’ en Toegang ‘Iedereen’.";
  return"Fout in het script: "+m}
function scriptMsg(err){return err&&err.name==="Error"?err.message:errText(err)}
function parseRoute(){var h=location.hash.slice(1);
  if(h==="beheer")return{k:"admin",pid:""};
  if(h.charAt(0)==="i"){var b=h.slice(1).split(".");return{k:"invite",pid:"",uid:b[0],token:b[1]||""}}
  if(h.charAt(0)==="j"){var a=h.slice(1).split(".");return{k:"join",pid:a[0],token:a[1]||""}}
  if(h.charAt(0)==="p")return{k:"owner",pid:h.slice(1)};return{k:"home",pid:""}}
function curPid(){return parseRoute().pid}
function getP(pid){return cur&&cur.pid===pid?cur.P:null}

/* ---------- Tellers ---------- */
function me(pid,id){var P=getP(pid);
  if(owner)return(P&&P.done&&P.done[id])||0;
  return(myMarks.counts&&myMarks.counts[id])||0}
function others(pid,id){var r=[];if(!owner)return r;
  Object.keys(marks).forEach(function(u){var c=marks[u].counts,n=c&&c[id];if(n>0)r.push({u:u,n:n})});return r}
function overOf(u,id){var m=owner?marks[u]:myMarks;return(m&&m.over&&m.over[id])||0}
function nameOf(u){return(members[u]&&members[u].name)||"Collega"}
function setCount(pid,id,n){id=String(id);
  if(owner){var D=cur.P.done;if(n>0)D[id]=n;else delete D[id]}
  else{myMarks.counts=myMarks.counts||{};if(n>0)myMarks.counts[id]=n;else delete myMarks.counts[id]}
  render();return w("setCount",{pid:pid,item:id,n:n})}
function setOver(u,pid,id,n){
  if(owner){marks[u]=marks[u]||{counts:{},over:{}};marks[u].over=marks[u].over||{};marks[u].over[id]=n}
  else{myMarks.over=myMarks.over||{};myMarks.over[id]=n}
  render();return w("setOver",{pid:pid,item:id,mid:u,n:n})}
function addExtra(pid,key,code,desc,n){key=key||"onbekend";var P=cur.P;P.extra=P.extra||{};
  var c=(P.extra[key]&&P.extra[key].n)||0;P.extra[key]={code:code,desc:desc,n:Math.max(0,c+n)};
  render();return w("addExtra",{pid:pid,key:key,code:code,desc:desc,n:n})}
function resolveOver(u,id,act){var pid=curPid(),P=cur.P,it=P.items.find(function(i){return i.id===id}),n=overOf(u,id);
  if(act==="extra")addExtra(pid,norm(it.code),it.code,it.desc,n);setOver(u,pid,id,0)}

function modal(title,text,btns){
  var m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");
  m.innerHTML='<div class="box"><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="btns"></div></div>';
  var b=m.querySelector(".btns");
  btns.forEach(function(x){var e=document.createElement("button");e.textContent=x.t;if(x.pri)e.className="pri";e.onclick=function(){m.remove();if(x.fn)x.fn()};b.appendChild(e)});
  document.body.appendChild(m);var lb=b.lastChild;setTimeout(function(){try{lb.focus()}catch(e){}},400)}

/* ---------- Laten staan en overzicht ---------- */
function stayRest(pid,undo){
  var P=cur.P,o={},c=0,u=0;
  if(!undo)P.items.forEach(function(i){var r=i.qty-me(pid,i.id);if(r>0){o[i.id]=r;c++;u+=r}});
  var go=function(){P.stay=o;render();w("setStay",{pid:pid,map:o});toast(undo?"Teruggezet":c+" artikelen blijven staan","ok")};
  if(undo)return go();
  if(!c)return toast("Alles is al afgevinkt","ok");
  modal("Rest laten staan?",c+" artikelen ("+u+" stuks) zijn niet afgevinkt en blijven staan. Je kunt dit later ongedaan maken.",[{t:"Annuleren"},{t:"Laten staan",pri:true,fn:go}])}
function fmtDT(ts){var d=new Date(Number(ts));return d.toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})+" "+d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})}
function finishProject(pid){
  var P=cur.P,open=[],units=0,waiting=0,o={};
  P.items.forEach(function(i){var r=i.qty-me(pid,i.id);if(r>0){open.push({i:i,r:r});units+=r;o[i.id]=r;if(others(pid,i.id).length)waiting++}});
  var ex=Object.keys(P.extra||{}).reduce(function(a,k){return a+(P.extra[k].n||0)},0);
  var txt="";
  if(open.length){
    txt="Let op: "+open.length+(open.length===1?" artikel is":" artikelen zijn")+" nog niet gescand ("+units+" stuks):\n"+open.slice(0,5).map(function(x){return"• "+(x.i.desc||x.i.code)+" ("+x.r+"×)"}).join("\n")+(open.length>5?"\n… en "+(open.length-5)+" andere":"")+"\n\n";
    if(waiting)txt+=waiting+" daarvan zijn wel door collega’s gescand, maar nog niet door jou bevestigd.\n\n";
  }else txt="Alles is gescand.\n\n";
  if(ex)txt+=ex+" stuks gaan extra retour.\n\n";
  txt+="Na afronden kun je niets meer scannen of afvinken. Het overzicht als PDF blijft beschikbaar en je kunt het project heropenen.\n\nWeet je het zeker?";
  var done=function(map){P.closed=Date.now();if(map)P.stay=o;ovOpen=true;render();
    w("finishProject",{pid:pid,map:map?o:null});toast("Project afgerond","ok")};
  var btns=[{t:"Annuleren"}];
  if(open.length){btns.push({t:"Afronden zonder",fn:function(){done(false)}});btns.push({t:"Rest laten staan en afronden",pri:true,fn:function(){done(true)}})}
  else btns.push({t:"Afronden",pri:true,fn:function(){done(false)}});
  modal("Retourlijst afronden?",txt,btns)}
function reopenProject(pid){
  modal("Project heropenen?","Je kunt dan weer scannen en afvinken.",[{t:"Annuleren"},{t:"Heropenen",pri:true,fn:function(){cur.P.closed=0;render();w("reopenProject",{pid:pid});toast("Project heropend","ok")}}])}
function lists(pid,P){
  var extra=Object.keys(P.extra||{}).map(function(k){var x=P.extra[k];return{key:k,code:x.code,desc:x.desc,n:x.n}}).filter(function(x){return x.n>0});
  var stay=P.items.filter(function(i){return(P.stay&&P.stay[i.id]||0)>0&&me(pid,i.id)<i.qty}).map(function(i){return{code:i.code,desc:i.desc,list:i.list||"",n:Math.min(P.stay[i.id],i.qty-me(pid,i.id))}});
  return{extra:extra,stay:stay}}
function csv(L){var r=["Soort;Lijst;Artikelnr;Omschrijving;Aantal"];L.extra.forEach(function(x){r.push(["Extra retour","",x.code,x.desc,x.n].join(";"))});L.stay.forEach(function(x){r.push(["Blijft staan",x.list,x.code,x.desc,x.n].join(";"))});return r.join("\n")}
function makePdf(pid,P,L){lib("jspdf").then(function(){makePdf_(pid,P,L)},function(){toast("PDF-maker kon niet laden. Controleer je internet en probeer opnieuw.","err")})}
function makePdf_(pid,P,L){
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast("PDF-maker kon niet laden. Controleer je internet en probeer opnieuw.","err");return}
  try{
    var d=new J({unit:"mm",format:"a4"}),W=210,M=14,y=0,pg=1;
    var dt=new Date(),ds=dt.toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})+" "+dt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
    function head(first){
      d.setFillColor(6,34,74);d.rect(0,0,W,first?34:14,"F");d.setFillColor(0,163,224);d.rect(0,first?34:14,W,1.6,"F");
      d.setTextColor(255,255,255);
      if(first){d.setFont("helvetica","bold");d.setFontSize(22);d.text("Retouri",M,16);d.setFont("helvetica","normal");d.setFontSize(9);d.text("NEP THE NETHERLANDS",M,22);
        d.setFontSize(10);d.text("Overzicht extra en blijft staan",M,29);d.text(ds,W-M,29,{align:"right"});y=44}
      else{d.setFont("helvetica","bold");d.setFontSize(10);d.text("Retouri  |  "+P.title,M,9);y=24}}
    function foot(){d.setFontSize(8);d.setTextColor(120,130,145);d.setFont("helvetica","normal");d.text("Pagina "+pg,W-M,290,{align:"right"});d.text("Retouri",M,290)}
    function np(){foot();d.addPage();pg++;head(false)}
    head(true);

/* ---------- PDF ---------- */
var DT=/^\d\d-\d\d-\d{4} \d\d:\d\d$/;
function parseRows(rows){
  var items=[],nr="",name="";
  rows.forEach(function(cells){
    var j=cells.join(" ").replace(/\s+/g," ").trim(),m;
    if(!nr&&(m=j.match(/Projectnr\.:\s*(\d+)/)))nr=m[1];
    if(!name&&(m=j.match(/Projectomschrijving:\s*(.+)$/)))name=m[1].trim();
    if(m=j.match(/^Opm(?:erkingen|\. logistiek):\s*(.*)$/)){
      if(items.length&&m[1]){var l=items[items.length-1];l.note=l.note?l.note+"; "+m[1]:m[1]}return}
    var it=null;
    if(cells.length>=6&&DT.test(cells[0])&&DT.test(cells[1])&&/^\d+$/.test(cells[cells.length-1])){
      var L=cells.length;it={code:cells[2],desc:cells[3],desc2:cells.slice(4,L-2).join(" "),loc:cells[L-2],qty:parseInt(cells[L-1],10)}}
    else if(m=j.match(/^\d\d-\d\d-\d{4} \d\d:\d\d \d\d-\d\d-\d{4} \d\d:\d\d (\S+) (.+) (\d+)$/)){
      it={code:m[1],desc:m[2],desc2:"",loc:"",qty:parseInt(m[3],10)}}
    if(it){it.note="";items.push(it)}
  });
  return{items:items,title:(nr?nr+" · ":"")+(name||"Retourlijst")}
}
async function parseFile(file){
  await lib("pdf");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,rows=[];
  for(var p=1;p<=doc.numPages;p++){
    var tc=await(await doc.getPage(p)).getTextContent(),g={};
    tc.items.forEach(function(it){if(!it.str.trim())return;var y=Math.round(it.transform[5]/3);(g[y]=g[y]||[]).push({x:it.transform[4],s:it.str.trim()})});
    Object.keys(g).map(Number).sort(function(a,b){return b-a}).forEach(function(y){rows.push(g[y].sort(function(a,b){return a.x-b.x}).map(function(r){return r.s}))});
  }
  var r=parseRows(rows),ln=file.name.replace(/\.pdf$/i,"");
  r.items.forEach(function(x){x.list=ln});
  return r}
/* Met pid: toevoegen aan dat project. Zonder pid: nieuw project met alle pdf's als aparte lijsten. */
async function importFiles(files,pid){
  if(!files.length)return;
  toast("PDF’s worden gelezen…","ok");
  try{
    var P=pid?getP(pid):null,existing=P?P.items:[],all=[],first=null,skipped=[];
    for(var k=0;k<files.length;k++){
      var f=files[k],ln=f.name.replace(/\.pdf$/i,"");
      if(existing.concat(all).some(function(i){return i.list===ln})&&!confirm("‘"+ln+"’ is al toegevoegd. Toch nogmaals toevoegen?"))continue;
      var r=await parseFile(f);
      if(!r.items.length){skipped.push(f.name);continue}
      if(!first)first=r;all=all.concat(r.items)}
    if(!all.length){toast("Geen artikelregels gevonden in "+(files.length>1?"deze pdf’s":"deze pdf"),"err");return}
    if(P){await api("addItems",{pid:pid,items:all});await load()}
    else{var j=await api("createProject",{title:first.title,items:all});location.hash="#p"+j.id}
    toast(all.length+" artikelen toegevoegd"+(skipped.length?". Niet gelezen: "+skipped.join(", "):""),skipped.length?"err":"ok");
  }catch(e){console.error(e);toast("Pdf lezen of opslaan mislukt","err")}
}

var lastScan="",lastT=0,stream=null,tmr=0,reader=null;
var idxC=null;
function idxFor(P){if(idxC&&idxC.items===P.items&&idxC.len===P.items.length)return idxC;
  var by={},list=P.items.map(function(i){var n=norm(i.code);i.n=n;(by[n]=by[n]||[]).push(i);return i});
  idxC={items:P.items,len:P.items.length,byCode:by,list:list};return idxC}
function scan(raw){
  var v=norm(raw),pid=curPid(),P=getP(pid);if(!v||!P||P.closed)return;
  if(document.querySelector(".modal"))return;var now=Date.now();if(v===lastScan&&now-lastT<1100)return;lastScan=v;lastT=now;stopCam();if(v.indexOf("250903")>-1)party();
  var ix=idxFor(P),hit=null,i0,L=ix.byCode[v];
  if(L)for(i0=0;i0<L.length;i0++)if(me(pid,L[i0].id)<L[i0].qty){hit=L[i0];break}
  if(!hit){for(i0=0;i0<ix.list.length;i0++){var c=ix.list[i0];if(me(pid,c.id)<c.qty&&v.indexOf(c.n)>-1){hit=c;break}}}
  if(hit){var n=me(pid,hit.id)+1;setCount(pid,hit.id,n);
    var el=$("it"+hit.id);if(el){el.classList.add("flash");el.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(function(){el.classList.remove("flash")},1200)}
    beep(true);toast("✓ "+hit.code+" "+hit.desc+(hit.qty>1?" ("+n+"/"+hit.qty+")":""),"ok");
    if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  }else{

      if(owner)modal("Te veel gescand",nm+" is al "+k.qty+"× afgevinkt. Dit is er één te veel.",[{t:"Zet terug",fn:function(){toast("Teruggezet, niet meegeteld","ok")}},{t:"Gaat extra retour",pri:true,fn:function(){addExtra(pid,norm(k.code),k.code,k.desc,1);toast("Genoteerd als extra retour","ok")}}]);
      else{modal("Te veel gescand",nm+" is al "+k.qty+"× gescand. Deze scan is niet meegeteld. De hoofdgebruiker beslist wat ermee gebeurt.",[{t:"Begrepen",pri:true}]);setOver(mid,pid,k.id,overOf(mid,k.id)+1)}
    }else{
      var c=catLookup(raw),nm2=c?c.desc+(c.desc2?" · "+c.desc2:""):"Onbekend artikel (niet in de artikellijst)";
      if(owner)modal("Niet op de lijst",(c?c.desc+(c.desc2?" ("+c.desc2+")":"")+"\n"+raw:raw)+"\nstaat niet op deze retourlijst.",[{t:"Negeren"},{t:"Gaat extra retour",pri:true,fn:function(){addExtra(pid,norm(raw),raw,nm2,1);toast("Genoteerd als extra retour: "+(c?c.desc:raw),"ok")}}]);
      else toast("Niet op de lijst: "+(c?c.desc+" ("+raw+")":raw),"err")}}
}

var AC=null;
function unlockAudio(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==="suspended")AC.resume()}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(function(ev){document.addEventListener(ev,unlockAudio,{passive:true})});
function tone(f,t0,d,type,vol){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,AC.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+d);
  o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+0.02)}
function beep(ok){try{unlockAudio();if(!AC)return;
  if(ok){tone(988,0,.12,"sine",.35);tone(1319,.09,.22,"sine",.35)}
  else{tone(220,0,.16,"square",.18);tone(165,.19,.26,"square",.18)}}catch(e){}}

/* Snelle QR-lezer: ingebouwde detector waar die bestaat, anders jsQR op het camerabeeld, anders ZXing. */
function jsqrRead(v,cv,cx){
  if(!window.jsQR||!v.videoWidth)return"";
  var sc=Math.min(1,720/v.videoWidth);cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);
  cx.drawImage(v,0,0,cv.width,cv.height);
  var d=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(d.data,d.width,d.height,{inversionAttempts:"dontInvert"});
  return r&&r.data?r.data:""}
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    var v=$("vid");v.srcObject=stream;await v.play();
    try{var tr=stream.getVideoTracks()[0],cap=tr.getCapabilities&&tr.getCapabilities();
      if(cap&&cap.focusMode&&cap.focusMode.indexOf("continuous")>=0)await tr.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
    try{var tk=stream.getVideoTracks()[0],cp=tk.getCapabilities&&tk.getCapabilities();torchOn=false;
      if(cp&&cp.torch){$("torch").textContent="Zaklamp aan";$("torch").classList.remove("hide")}else $("torch").classList.add("hide")}catch(e){$("torch").classList.add("hide")}
    $("camwrap").classList.remove("hide");$("camnote").textContent="Houd de QR-code in beeld, niet te dichtbij";
    var det=null;if("BarcodeDetector" in window){try{det=new BarcodeDetector({formats:["qr_code"]})}catch(e){try{det=new BarcodeDetector()}catch(e2){det=null}}}
    if(!det&&!window.jsQR){try{await lib("jsqr")}catch(e){}}
    if(!det&&!window.jsQR){try{await lib("zxing")}catch(e){}}
    if(!det&&!window.jsQR&&window.ZXing){reader=new ZXing.BrowserQRCodeReader();reader.decodeFromVideoElement(v,function(res){if(res)scan(res.getText())});return}
    if(!det&&!window.jsQR){$("camnote").textContent="Scannen niet ondersteund; typ de code.";return}
    var cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    (function loop(){
      if(!stream)return;
      var p=det?det.detect(v).then(function(r){return r.length?r[0].rawValue:""}).catch(function(){return""}):Promise.resolve(jsqrRead(v,cv,cx));
      p.then(function(val){if(val)scan(val)}).then(function(){tmr=setTimeout(loop,det?50:60)})
    })();
  }catch(e){console.error("camera:",e&&e.name,e&&e.message);stopCam();
    var n=e&&e.name,msg=n==="NotAllowedError"?"Camera geweigerd. Sta de camera toe in de instellingen van je browser voor deze site.":n==="NotFoundError"?"Geen camera gevonden op dit apparaat.":n==="NotReadableError"?"De camera wordt al door een andere app gebruikt.":"Camera starten mislukt.";
    toast(msg,"err")}
}

  tk.applyConstraints({advanced:[{torch:want}]}).then(function(){torchOn=want;$("torch").textContent=want?"Zaklamp uit":"Zaklamp aan"}).catch(function(){toast("Zaklamp werkt niet op dit apparaat","err")})}
