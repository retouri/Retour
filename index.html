<body>
<header class="brand"><div class="in"><button id="menu" class="hide" type="button" aria-label="Menu openen">☰</button><div class="tt"><h1>Assi<b>app</b><span class="co">NEP The Netherlands</span></h1><p class="sub" id="who">Laden…</p></div><button id="out" class="hide">Uitloggen</button></div></header>
<nav id="nav" class="hide" aria-label="Hoofdmenu"><div class="nb"><div class="logo">Assi<b>app</b></div><div id="navlinks"></div><button id="navout" type="button">Uitloggen</button></div></nav>
<div id="navbg"></div>
<button id="top" aria-label="Naar boven" type="button">↑</button>
<main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="app"></div>
</main>

<script>
/* ===== VUL DIT IN (zie README.md) ===== */
var API_URL="https://script.google.com/macros/s/AKfycbxTRTePUvdtyvWWLOXaprklpm3C5SWaI5QVzNDsGwJcXHlQCRTZDDQLmiaJDs1bfQBc/exec"; /* de Web-app-URL van je Apps Script, eindigt op /exec */
/* ====================================== */
(function(){
var $=function(i){return document.getElementById(i)};
/* Zware onderdelen worden pas geladen als ze nodig zijn: dat maakt de start veel sneller. */
var LIBS={pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",jsqr:"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",zxing:"https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"},LP={};
function lib(n){if(LP[n])return LP[n];return LP[n]=new Promise(function(ok,no){var e=document.createElement("script");e.src=LIBS[n];e.onload=ok;e.onerror=function(){delete LP[n];no(new Error("lib "+n))};document.head.appendChild(e)})}
function idle(f){(window.requestIdleCallback||function(g){setTimeout(g,1500)})(f)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
var tt;function toast(t,k){if(k==="err")reportErr(t);var e=$("toast");e.textContent=t;e.className=k;clearTimeout(tt);tt=setTimeout(function(){e.className=""},3500)}
if(!API_URL){$("who").textContent="Nog niet ingesteld.";$("app").innerHTML='<div class="panel"><p>Vul bovenin <b>index.html</b> de <b>API_URL</b> in. Zie README.md.</p></div>';return}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function load_(k){try{return localStorage.getItem(k)||""}catch(e){return""}}

/* acct = ingelogd met account. owner = dat account is beheerder. Zonder account kan iemand via een deellink meedoen (mid). */
var isAdmin=false,acct=false,owner=false,my={role:"",perms:{}},uid="",sess="",mid="",plist=[],users=[],lastInvite=null,cur=null,marks={},members={},myMarks={},lastV="",pending=0,ready=false,meSig="";
var filter="all",q="",listF="",ovOpen=false;
function can(p){return owner||!!(my.perms&&my.perms[p])}
function whoText(){
  if(!acct)return;
  var n=load_("retourAcctName")||"jij";
  $("who").textContent="Ingelogd als "+n+(my.role==="beheerder"?" (beheerder)":my.role==="senior"?" (senior)":"")+(my.functie?" · "+my.functie:"")}
function setMe(m){
  if(!m)return;
  my=m;owner=m.role==="beheerder"||m.role==="senior";isAdmin=m.role==="beheerder";store("retourMe",JSON.stringify(m));
  var s=JSON.stringify(m);if(s!==meSig){if(meSig)$("app").innerHTML="";meSig=s}
  whoText()}
function ck(n){return"retourC_"+(acct?uid:mid)+"_"+n}
function cset(n,v){try{localStorage.setItem(ck(n),JSON.stringify(v))}catch(e){try{cwipe()}catch(x){}}}
function cget(n){try{var t=localStorage.getItem(ck(n));return t?JSON.parse(t):null}catch(e){return null}}
function cwipe(){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("retourC_")===0)localStorage.removeItem(k)})}catch(e){}}
function clearAuth(){cwipe();acct=false;owner=false;isAdmin=false;my={role:"",perms:{}};uid="";sess="";mid="";meSig="";lastInvite=null;
  ["retourUid","retourSess","retourMe","retourAcctName"].forEach(function(k){store(k,null)})}
function onLogin(j){
  acct=true;uid=j.uid;sess=j.session;mid="u_"+uid;store("retourSetupDone","1");store("retourUid",uid);store("retourSess",sess);store("retourAcctName",j.name);
  meSig="";setMe(j.me);go()}

/* ---------- Verbinding met het script ---------- */
function authObj(){if(acct)return{user:true,uid:uid,session:sess};var r=parseRoute();return{mid:mid,pid:r.pid,token:r.token}}
function api(action,data,noAuth){
  var body=Object.assign({action:action,auth:noAuth?null:authObj()},data||{});
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j})}
function w(action,data){pending++;
  return api(action,data).catch(function(e){console.error(e);if(e&&e.message==="auth")return handleErr(e);toast("Opslaan mislukt: "+scriptMsg(e),"err");load()}).then(function(){pending--})}
function errText(e){var m=String(e&&e.message||e);
  if(e&&e.name==="TypeError")return"Geen verbinding met het script (geblokkeerd of verkeerde URL). Technisch: "+m;
  if(e&&e.name==="SyntaxError")return"Het script geeft geen geldig antwoord. Controleer bij Implementeren: Uitvoeren als ‘Ik’ en Toegang ‘Iedereen’.";
  return"Fout in het script: "+m}
function scriptMsg(err){return err&&err.name==="Error"?err.message:errText(err)}
function parseRoute(){var h=location.hash.slice(1);
  if(h==="beheer")return{k:"admin",pid:""};
  if(h==="retour")return{k:"retour",pid:""};
  if(h==="team")return{k:"team",pid:""};
  if(h==="tips")return{k:"tips",pid:""};
  if(h==="overleg")return{k:"overleg",pid:""};
  if(h==="appbouwer")return{k:"appbouwer",pid:""};
  if(h==="blog"||h.indexOf("blog/")===0)return{k:"blog",pid:"",klus:h.slice(5)};
  if(h.charAt(0)==="i"){var b=h.slice(1).split(".");return{k:"invite",pid:"",uid:b[0],token:b[1]||""}}
  if(h.charAt(0)==="j"){var a=h.slice(1).split(".");return{k:"join",pid:a[0],token:a[1]||""}}
  if(h.charAt(0)==="p")return{k:"owner",pid:h.slice(1)};return{k:"home",pid:""}}
var kindOf={home:"home",retour:"retour",owner:"retour",admin:"admin",blog:"blog",team:"team",tips:"tips",overleg:"overleg",appbouwer:"appbouwer"};
function curPid(){return parseRoute().pid}
function getP(pid){return cur&&cur.pid===pid?cur.P:null}

/* ---------- Tellers ---------- */
function me(pid,id){var P=getP(pid);
  if(owner)return(P&&P.done&&P.done[id])||0;
  return(myMarks.counts&&myMarks.counts[id])||0}
function others(pid,id){var r=[];if(!owner)return r;
  Object.keys(marks).forEach(function(u){var c=marks[u].counts,n=c&&c[id];if(n>0)r.push({u:u,n:n})});return r}
function overOf(u,id){var m=owner?marks[u]:myMarks;return(m&&m.over&&m.over[id])||0}
function nameOf(u){return(members[u]&&members[u].name)||"Collega"}
function setCount(pid,id,n){id=String(id);
  if(owner){var D=cur.P.done;if(n>0)D[id]=n;else delete D[id]}
  else{myMarks.counts=myMarks.counts||{};if(n>0)myMarks.counts[id]=n;else delete myMarks.counts[id]}
  render();return w("setCount",{pid:pid,item:id,n:n})}
function setOver(u,pid,id,n){
  if(owner){marks[u]=marks[u]||{counts:{},over:{}};marks[u].over=marks[u].over||{};marks[u].over[id]=n}
  else{myMarks.over=myMarks.over||{};myMarks.over[id]=n}
  render();return w("setOver",{pid:pid,item:id,mid:u,n:n})}
function addExtra(pid,key,code,desc,n){key=key||"onbekend";var P=cur.P;P.extra=P.extra||{};
  var c=(P.extra[key]&&P.extra[key].n)||0;P.extra[key]={code:code,desc:desc,n:Math.max(0,c+n)};
  render();return w("addExtra",{pid:pid,key:key,code:code,desc:desc,n:n})}
function resolveOver(u,id,act){var pid=curPid(),P=cur.P,it=P.items.find(function(i){return i.id===id}),n=overOf(u,id);
  if(act==="extra")addExtra(pid,norm(it.code),it.code,it.desc,n);setOver(u,pid,id,0)}

function modal(title,text,btns){
  var m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");
  m.innerHTML='<div class="box"><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="btns"></div></div>';
  var b=m.querySelector(".btns");
  btns.forEach(function(x){var e=document.createElement("button");e.textContent=x.t;if(x.pri)e.className="pri";e.onclick=function(){m.remove();if(x.fn)x.fn()};b.appendChild(e)});
  document.body.appendChild(m);var lb=b.lastChild;setTimeout(function(){try{lb.focus()}catch(e){}},400)}

/* ---------- Laten staan en overzicht ---------- */
function stayRest(pid,undo){
  var P=cur.P,o={},c=0,u=0;
  if(!undo)P.items.forEach(function(i){var r=i.qty-me(pid,i.id);if(r>0){o[i.id]=r;c++;u+=r}});
  var go=function(){P.stay=o;render();w("setStay",{pid:pid,map:o});toast(undo?"Teruggezet":c+" artikelen blijven staan","ok")};
  if(undo)return go();
  if(!c)return toast("Alles is al afgevinkt","ok");
  modal("Rest laten staan?",c+" artikelen ("+u+" stuks) zijn niet afgevinkt en blijven staan. Je kunt dit later ongedaan maken.",[{t:"Annuleren"},{t:"Laten staan",pri:true,fn:go}])}
var RETENTIE=14;
function daysLeft(created){var d=RETENTIE-Math.floor((Date.now()-Number(created))/86400000);return d<=0?"vandaag":"over "+d+(d===1?" dag":" dagen")}
function fmtDT(ts){var d=new Date(Number(ts));return d.toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})+" "+d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})}
function finishProject(pid){
  var P=cur.P,open=[],units=0,waiting=0,o={};
  P.items.forEach(function(i){var r=i.qty-me(pid,i.id);if(r>0){open.push({i:i,r:r});units+=r;o[i.id]=r;if(others(pid,i.id).length)waiting++}});
  var ex=Object.keys(P.extra||{}).reduce(function(a,k){return a+(P.extra[k].n||0)},0);
  var txt="";
  if(open.length){
    txt="Let op: "+open.length+(open.length===1?" artikel is":" artikelen zijn")+" nog niet gescand ("+units+" stuks):\n"+open.slice(0,5).map(function(x){return"• "+(x.i.desc||x.i.code)+" ("+x.r+"×)"}).join("\n")+(open.length>5?"\n… en "+(open.length-5)+" andere":"")+"\n\n";
    if(waiting)txt+=waiting+" daarvan zijn wel door collega’s gescand, maar nog niet door jou bevestigd.\n\n";
  }else txt="Alles is gescand.\n\n";
  if(ex)txt+=ex+" stuks gaan extra retour.\n\n";
  txt+="Na afronden kun je niets meer scannen of afvinken. Het overzicht als PDF blijft beschikbaar en je kunt het project heropenen.\n\nWeet je het zeker?";
  var done=function(map){P.closed=Date.now();if(map)P.stay=o;ovOpen=true;render();
    w("finishProject",{pid:pid,map:map?o:null});toast("Project afgerond","ok")};
  var btns=[{t:"Annuleren"}];
  if(open.length){btns.push({t:"Afronden zonder",fn:function(){done(false)}});btns.push({t:"Rest laten staan en afronden",pri:true,fn:function(){done(true)}})}
  else btns.push({t:"Afronden",pri:true,fn:function(){done(false)}});
  modal("Retourlijst afronden?",txt,btns)}
function reopenProject(pid){
  modal("Project heropenen?","Je kunt dan weer scannen en afvinken.",[{t:"Annuleren"},{t:"Heropenen",pri:true,fn:function(){cur.P.closed=0;render();w("reopenProject",{pid:pid});toast("Project heropend","ok")}}])}
function lists(pid,P){
  var extra=Object.keys(P.extra||{}).map(function(k){var x=P.extra[k];return{key:k,code:x.code,desc:x.desc,n:x.n}}).filter(function(x){return x.n>0});
  var stay=P.items.filter(function(i){return(P.stay&&P.stay[i.id]||0)>0&&me(pid,i.id)<i.qty}).map(function(i){return{code:i.code,desc:i.desc,list:i.list||"",n:Math.min(P.stay[i.id],i.qty-me(pid,i.id))}});
  return{extra:extra,stay:stay}}
function csv(L){var r=["Soort;Lijst;Artikelnr;Omschrijving;Aantal"];L.extra.forEach(function(x){r.push(["Extra retour","",x.code,x.desc,x.n].join(";"))});L.stay.forEach(function(x){r.push(["Blijft staan",x.list,x.code,x.desc,x.n].join(";"))});return r.join("\n")}
function makePdf(pid,P,L){lib("jspdf").then(function(){makePdf_(pid,P,L)},function(){toast("PDF-maker kon niet laden. Controleer je internet en probeer opnieuw.","err")})}
function makePdf_(pid,P,L){
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast("PDF-maker kon niet laden. Controleer je internet en probeer opnieuw.","err");return}
  try{
    var d=new J({unit:"mm",format:"a4"}),W=210,M=14,y=0,pg=1;
    var dt=new Date(),ds=dt.toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})+" "+dt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
    function head(first){
      d.setFillColor(6,34,74);d.rect(0,0,W,first?34:14,"F");d.setFillColor(0,163,224);d.rect(0,first?34:14,W,1.6,"F");
      d.setTextColor(255,255,255);
      if(first){d.setFont("helvetica","bold");d.setFontSize(22);d.text("Retouri",M,16);d.setFont("helvetica","normal");d.setFontSize(9);d.text("NEP THE NETHERLANDS",M,22);
        d.setFontSize(10);d.text("Overzicht extra en blijft staan",M,29);d.text(ds,W-M,29,{align:"right"});y=44}
      else{d.setFont("helvetica","bold");d.setFontSize(10);d.text("Retouri  |  "+P.title,M,9);y=24}}
    function foot(){d.setFontSize(8);d.setTextColor(120,130,145);d.setFont("helvetica","normal");d.text("Pagina "+pg,W-M,290,{align:"right"});d.text("Retouri",M,290)}
    function np(){foot();d.addPage();pg++;head(false)}
    head(true);
    d.setTextColor(11,29,51);d.setFont("helvetica","bold");d.setFontSize(13);
    d.text(d.splitTextToSize("Project: "+P.title,W-2*M),M,y);y+=9;
    if(P.closed){d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(60,75,95);d.text("Afgerond op "+fmtDT(P.closed),M,y);y+=8}
    function sect(title,rows,showList){
      if(y>250)np();
      d.setFont("helvetica","bold");d.setFontSize(12);d.setTextColor(6,34,74);d.text(title+" ("+rows.length+")",M,y);
      d.setDrawColor(0,163,224);d.setLineWidth(.6);d.line(M,y+1.8,W-M,y+1.8);y+=8;
      if(!rows.length){d.setFont("helvetica","italic");d.setFontSize(10);d.setTextColor(110,120,135);d.text("Geen.",M,y);y+=10;return}
      d.setFillColor(232,238,246);d.rect(M,y-4.6,W-2*M,6.6,"F");
      d.setFont("helvetica","bold");d.setFontSize(9);d.setTextColor(6,34,74);
      d.text("Aantal",M+2,y);d.text("Artikelnr",M+22,y);d.text("Omschrijving",M+62,y);y+=6;
      var tot=0;
      rows.forEach(function(x,k){
        var desc=d.splitTextToSize(String(x.desc||"")+(showList&&x.list?"  (lijst "+x.list+")":""),W-M-(M+62)-2);
        var h=Math.max(6,desc.length*4.6+2);
        if(y+h>278){np()}
        if(k%2===0){d.setFillColor(247,249,252);d.rect(M,y-4.2,W-2*M,h,"F")}
        d.setFont("helvetica","bold");d.setFontSize(10);d.setTextColor(11,29,51);d.text(x.n+"x",M+2,y);
        d.setFont("helvetica","normal");d.text(String(x.code),M+22,y);
        d.setFontSize(9.5);d.text(desc,M+62,y);y+=h;tot+=x.n});
      d.setFont("helvetica","bold");d.setFontSize(10);d.setTextColor(6,34,74);d.text("Totaal: "+tot+" stuks",W-M,y+1,{align:"right"});y+=12}
    sect("Extra retour",L.extra,false);
    sect("Blijft staan",L.stay,true);
    foot();
    d.save("Retouri-overzicht-"+(P.title||"project").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"")+".pdf");
  }catch(e){console.error(e);toast("PDF maken mislukt","err")}}
function renderOv(pid,P){
  var b=$("ovbox");if(!b)return;if(!ovOpen){b.innerHTML="";return}
  var L=lists(pid,P);
  function tbl(t,a,ed){return'<h2 style="margin-top:14px">'+t+' ('+a.length+')</h2>'+(a.length?'<table class="ov">'+a.map(function(x){return'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.desc)+'</td><td><b>'+x.n+'×</b></td>'+(ed?'<td style="white-space:nowrap"><button class="sm" data-xdec="'+esc(x.key)+'" aria-label="Eén minder">−1</button><button class="sm" data-xdel="'+esc(x.key)+'" aria-label="Verwijderen">Verwijder</button></td>':'')+'</tr>'}).join("")+'</table>':'<p class="mut">Geen.</p>')}
  b.innerHTML=tbl("Extra retour",L.extra,!P.closed)+tbl("Blijft staan",L.stay)+'<div class="btns"><button class="pri" id="ovsave">Download als PDF</button><button id="ovcopy">Kopiëren</button></div>';
  $("ovsave").onclick=function(){makePdf(pid,P,L)};
  $("ovcopy").onclick=function(){try{navigator.clipboard.writeText(csv(L)).then(function(){toast("Overzicht gekopieerd","ok")},function(){toast("Kopiëren geblokkeerd","err")})}catch(e){toast("Kopiëren geblokkeerd","err")}}}

/* ---------- PDF ---------- */
var DT=/^\d\d-\d\d-\d{4} \d\d:\d\d$/;
function parseRows(rows){
  var items=[],nr="",name="";
  rows.forEach(function(cells){
    var j=cells.join(" ").replace(/\s+/g," ").trim(),m;
    if(!nr&&(m=j.match(/Projectnr\.:\s*(\d+)/)))nr=m[1];
    if(!name&&(m=j.match(/Projectomschrijving:\s*(.+)$/)))name=m[1].trim();
    if(m=j.match(/^Opm(?:erkingen|\. logistiek):\s*(.*)$/)){
      if(items.length&&m[1]){var l=items[items.length-1];l.note=l.note?l.note+"; "+m[1]:m[1]}return}
    var it=null;
    if(cells.length>=6&&DT.test(cells[0])&&DT.test(cells[1])&&/^\d+$/.test(cells[cells.length-1])){
      var L=cells.length;it={code:cells[2],desc:cells[3],desc2:cells.slice(4,L-2).join(" "),loc:cells[L-2],qty:parseInt(cells[L-1],10)}}
    else if(m=j.match(/^\d\d-\d\d-\d{4} \d\d:\d\d \d\d-\d\d-\d{4} \d\d:\d\d (\S+) (.+) (\d+)$/)){
      it={code:m[1],desc:m[2],desc2:"",loc:"",qty:parseInt(m[3],10)}}
    if(it){it.note="";items.push(it)}
  });
  return{items:items,title:(nr?nr+" · ":"")+(name||"Retourlijst")}
}
async function parseFile(file){
  await lib("pdf");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,rows=[];
  for(var p=1;p<=doc.numPages;p++){
    var tc=await(await doc.getPage(p)).getTextContent(),g={};
    tc.items.forEach(function(it){if(!it.str.trim())return;var y=Math.round(it.transform[5]/3);(g[y]=g[y]||[]).push({x:it.transform[4],s:it.str.trim()})});
    Object.keys(g).map(Number).sort(function(a,b){return b-a}).forEach(function(y){rows.push(g[y].sort(function(a,b){return a.x-b.x}).map(function(r){return r.s}))});
  }
  var r=parseRows(rows),ln=file.name.replace(/\.pdf$/i,"");
  r.items.forEach(function(x){x.list=ln});
  return r}
/* Met pid: toevoegen aan dat project. Zonder pid: nieuw project met alle pdf's als aparte lijsten. */
async function importFiles(files,pid){
  if(!files.length)return;
  toast("PDF’s worden gelezen…","ok");
  try{
    var P=pid?getP(pid):null,existing=P?P.items:[],all=[],first=null,skipped=[];
    for(var k=0;k<files.length;k++){
      var f=files[k],ln=f.name.replace(/\.pdf$/i,"");
      if(existing.concat(all).some(function(i){return i.list===ln})&&!confirm("‘"+ln+"’ is al toegevoegd. Toch nogmaals toevoegen?"))continue;
      var r=await parseFile(f);
      if(!r.items.length){skipped.push(f.name);continue}
      if(!first)first=r;all=all.concat(r.items)}
    if(!all.length){toast("Geen artikelregels gevonden in "+(files.length>1?"deze pdf’s":"deze pdf"),"err");return}
    if(P){await api("addItems",{pid:pid,items:all});await load()}
    else{var j=await api("createProject",{title:first.title,items:all});location.hash="#p"+j.id}
    toast(all.length+" artikelen toegevoegd"+(skipped.length?". Niet gelezen: "+skipped.join(", "):""),skipped.length?"err":"ok");
  }catch(e){console.error(e);toast("Pdf lezen of opslaan mislukt","err")}
}

    $("kadd").onclick=function(){var v=$("knm").value.trim();if(v.length<2)return toast("Geef de klus een naam","err");$("kadd").disabled=true;
      api("addKlus",{naam:v}).then(function(j){bAdd=false;bShown="";location.hash="#blog/"+j.id;load()}).catch(function(e){$("kadd").disabled=false;toast(scriptMsg(e),"err")})};
    setTimeout(function(){$("knm").focus()},50)}
  if(!bAdd&&nb.firstChild)nb.innerHTML="";
  var m=$("bmain");
  if(!kl||!cur_){
    var h="";
    if(!blog.klussen.length)h='<section class="panel"><p class="mut" style="margin:0">Nog geen klussen. Voeg met ‘＋ Nieuwe klus’ de eerste toe en plaats een tip of bevinding.</p></section>';
    else h='<section class="panel"><p class="mut" style="margin:0">Kies hierboven een klus om de berichten te lezen en te reageren.'+(kl?" Deze klus bestaat niet (meer).":"")+'</p></section>';
    if(bShown!=="L"+h){m.innerHTML=h;bShown="L"+h}return}
  if(bShown.indexOf("K"+kl)!==0){
    m.innerHTML='<section class="panel"><div class="head"><h2>'+esc(cur_.naam)+'</h2>'+(owner?'<button class="x" data-delklus="'+kl+'" aria-label="Klus verwijderen">Klus verwijderen</button>':'')+'</div>'+
    '<div class="row"><select id="bsoort" aria-label="Soort bericht"><option value="tip">Tip</option><option value="bevinding">Bevinding</option><option value="opmerking">Opmerking</option><option value="mening">Mening</option></select></div>'+
    '<textarea id="btxt" data-draft="new" placeholder="Wat wil je delen met collega\'s?" style="margin-top:8px"></textarea><div class="btns" style="margin-top:8px"><button class="pri" id="bsend">Plaatsen</button></div></section><section class="panel" id="bposts"></section>';
    $("btxt").value=bDraft["new"]||"";
    $("bsend").onclick=function(){var t=$("btxt").value.trim();if(!t)return toast("Schrijf eerst iets","err");$("bsend").disabled=true;
      api("addPost",{klus:kl,tekst:t,soort:$("bsoort").value}).then(function(){bDraft["new"]="";$("btxt").value="";$("bsend").disabled=false;load()}).catch(function(e){$("bsend").disabled=false;toast(scriptMsg(e),"err")})};
    bShown="K"+kl+"|"}
  var tops=bposts.filter(function(p){return!p.parent}).sort(function(a,b){return b.tijd-a.tijd}),
      html=tops.length?tops.map(function(p){return postHtml(p,bposts.filter(function(x){return x.parent===p.id}))}).join(""):'<p class="mut" style="margin:0">Nog geen berichten bij deze klus. Plaats de eerste!</p>';
  var key="K"+kl+"|"+html+"|"+bOpenRep;
  if(bShown!==key){$("bposts").innerHTML=html;bShown=key;var rt=$("rt");if(rt){rt.value=bDraft[rt.getAttribute("data-draft")]||"";}}}
document.addEventListener("input",function(e){var d=e.target.getAttribute&&e.target.getAttribute("data-draft");if(d)bDraft[d]=e.target.value});
document.addEventListener("click",function(e){
  var t=e.target;if(!t.getAttribute)return;
  var k=t.closest&&t.closest("[data-klus]");if(k){bAdd=false;bShown="";location.hash="#blog/"+k.getAttribute("data-klus");return}
  var rp=t.getAttribute("data-rep");if(rp){bOpenRep=rp;bShown+="*";renderBlog();var x=$("rt");if(x)x.focus();return}
  if(t.getAttribute("data-closerep")){bOpenRep="";renderBlog();return}
  var sr=t.getAttribute("data-sendrep");if(sr){var v=($("rt")||{}).value||"";if(!v.trim())return toast("Schrijf eerst iets","err");t.disabled=true;
    api("addPost",{klus:parseRoute().klus,tekst:v,soort:"opmerking",parent:sr}).then(function(){bDraft[sr]="";bOpenRep="";load()}).catch(function(er){t.disabled=false;toast(scriptMsg(er),"err")});return}
  var dp=t.getAttribute("data-delpost");if(dp){if(confirm("Bericht verwijderen? Reacties daarop verdwijnen ook.")){bposts=bposts.filter(function(p){return p.id!==dp&&p.parent!==dp});renderBlog();api("deletePost",{id:dp}).then(function(){load()}).catch(function(er){toast(scriptMsg(er),"err");load()})}return}
  var dk=t.getAttribute("data-delklus");if(dk){if(confirm("Deze klus met alle berichten verwijderen?"))api("deleteKlus",{id:dk}).then(function(){bShown="";location.hash="#blog";load()}).catch(function(er){toast(scriptMsg(er),"err")});return}
});
function isStandalone(){try{return window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches||window.matchMedia("(display-mode: fullscreen)").matches}catch(e){return false}}
function isMobile(){var u=navigator.userAgent||"";return /iPhone|iPad|iPod|Android/i.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)}
var introTab="";
function showIntro(){
  var ua=navigator.userAgent||"",tab=introTab||(/android/i.test(ua)?"a":"i");
  $("who").textContent="Welkom bij Assiapp";
  var ios='<ol class="steps"><li>Open deze pagina in <b>Safari</b>. Andere browsers werken op iPhone en iPad niet voor deze stap.</li><li>Tik onderin (iPhone) of bovenin (iPad) op het <b>Deel-icoon</b>: een vierkantje met een pijl omhoog.</li><li>Scroll in het menu en tik op <b>Zet op beginscherm</b>. Staat die niet direct in beeld? Tik eerst op <b>Meer</b>.</li><li>Laat de naam <b>Assiapp</b> staan en tik rechtsboven op <b>Voeg toe</b>.</li><li>Sluit Safari en open Assiapp voortaan via het <b>icoon op je beginscherm</b>.</li></ol>';
  var and='<ol class="steps"><li>Open deze pagina in <b>Chrome</b>.</li><li>Tik rechtsboven op de <b>drie puntjes</b> (⋮).</li><li>Tik op <b>Toevoegen aan startscherm</b> en daarna op <b>Installeren</b> (of <b>Toevoegen</b>).</li><li>Bevestig met <b>Toevoegen</b>. Het icoon verschijnt op je startscherm.</li><li>Open Assiapp voortaan via dat <b>icoon</b>.</li></ol>';
  $("app").innerHTML='<div class="hero">Zet Assiapp op je beginscherm</div><div class="mut" style="margin-bottom:12px">Dan werkt de app als een gewone app, zonder adresbalk, en is hij altijd één tik weg. Kies jouw toestel:</div>'+
  '<div class="tabs"><button class="tab'+(tab==="i"?" on":"")+'" data-itab="i">iPhone / iPad</button><button class="tab'+(tab==="a"?" on":"")+'" data-itab="a">Android</button></div>'+
  '<section class="panel">'+(tab==="i"?ios:and)+'</section>'+
  '<div class="mut" style="margin-bottom:12px">Let op: de app op je beginscherm is een aparte plek. Je moet daar één keer opnieuw inloggen.</div>'+
  '<div class="btns"><button class="pri" id="introgo">Ik heb hem toegevoegd, doorgaan</button><button id="introskip">Nu niet</button></div>'}
document.addEventListener("click",function(e){var t=e.target;if(!t||!t.getAttribute)return;
  var it=t.getAttribute("data-itab");if(it){introTab=it;showIntro();return}
  if(t.id==="introgo"||t.id==="introskip"){store("assiIntro","1");go()}});
function go(){
  stopCam();cur=null;marks={};members={};myMarks={};lastV="";ready=false;$("app").innerHTML="";$("app").removeAttribute("data-t");
  var r=parseRoute();
  $("out").classList.add("hide");navShow(false);
  if(isMobile()&&!isStandalone()&&!load_("assiIntro"))return showIntro();
  if(r.k==="invite")return showAccept(r);
  if(!acct){
    if(r.k==="join"){mid=load_("mid_"+r.pid);if(!mid)return showName(r);
      $("who").textContent="Je doet mee via een deellink. Jouw scans zijn zichtbaar voor de beheerder.";return load()}
    return showLogin()}
  whoText();navShow(true);
  if(r.k==="join"){location.hash="#p"+r.pid;return}
  if(r.k==="admin"&&!owner){location.hash="#home";return}
  bShown="";load()}

document.addEventListener("click",function(e){
  var t=e.target;if(!t.getAttribute)return;
  var gg=t.getAttribute("data-go");if(gg){location.hash="#"+gg;return}
  var ua=t.getAttribute("data-ua");if(ua){var p2=ua.split("|");userAction(p2[0],p2[1]);return}
  var xd=t.getAttribute("data-xdec"),xx=t.getAttribute("data-xdel");
  if((xd||xx)&&cur){var key=xd||xx,ex=cur.P.extra&&cur.P.extra[key];if(!ex)return;
    if(xd){addExtra(cur.pid,key,ex.code,ex.desc,-1);return}
    if(confirm("‘"+ex.desc+"’ ("+ex.n+"×) uit extra retour verwijderen?"))addExtra(cur.pid,key,ex.code,ex.desc,-ex.n);return}
  var ov=t.getAttribute("data-ov");if(ov){var a=ov.split("|");resolveOver(a[0],a[1],a[2]);return}
  var dm=t.getAttribute("data-delm");if(dm){if(confirm("Toegang van deze collega intrekken?")){delete members[dm];render();w("removeMember",{pid:curPid(),mid:dm})}return}
  var d=t.getAttribute("data-delp");
  if(d){e.stopPropagation();if(confirm("Project en alle afvinkingen verwijderen?")){plist=plist.filter(function(p){return p.id!==d});render();w("deleteProject",{pid:d})}return}
  var o=t.closest&&t.closest("[data-open]");if(o)location.hash="#p"+o.getAttribute("data-open")});
document.addEventListener("change",function(e){
  var t=e.target;if(t.getAttribute&&t.hasAttribute("data-fn")){var fr=t.closest("[data-uid]");if(fr&&t.value)api("setFunctie",{uid:fr.getAttribute("data-uid"),functie:t.value}).then(function(){toast("Functie opgeslagen","ok");load()}).catch(function(er){toast(scriptMsg(er),"err");load()});return}
  if(!t.getAttribute||!(t.hasAttribute("data-role")||t.hasAttribute("data-perm")))return;
  var row=t.closest("[data-uid]");if(row)saveRights(row)});
window.addEventListener("hashchange",go);
$("top").onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
window.addEventListener("scroll",function(){$("top").classList.toggle("show",(window.pageYOffset||document.documentElement.scrollTop)>300)},{passive:true});
$("out").onclick=function(){clearAuth();go()};

/* Elke 6 seconden kijken of er iets veranderd is (alleen als de pagina zichtbaar is). */
setInterval(function(){
  if(document.hidden||pending>0||!ready)return;
  var r=parseRoute();if(r.k==="admin"||r.k==="invite"||r.k==="home"||r.k==="team"||r.k==="tips"||r.k==="overleg"||r.k==="appbouwer")return;
  var key=r.k==="blog"?"blog":(acct&&r.k!=="owner")?"_all":r.pid;if(!key)return;
  var cmp=r.k==="blog"?blogV:lastV;
  api("version",{key:key},true).then(function(j){if(j.v!==cmp&&pending===0)load()}).catch(function(){})},6000);

if(load_("retourSess")&&load_("retourUid")){
  acct=true;uid=load_("retourUid");sess=load_("retourSess");mid="u_"+uid;
  try{var sm=JSON.parse(load_("retourMe")||"null");if(sm){my=sm;owner=sm.role==="beheerder"||sm.role==="senior";isAdmin=sm.role==="beheerder";meSig=JSON.stringify(sm)}}catch(e){}
}
go();

/* Automatisch bijwerken: als er een nieuwe versie op GitHub staat, laadt de app die zelf (ook vanaf het beginscherm). */
var BUILD="20261126215115";
function checkUpdate(){
  if(BUILD==="__BUILD__"||document.hidden)return;
  fetch(location.pathname+"?u="+Date.now(),{cache:"reload"}).then(function(r){return r.text()}).then(function(t){
    var m=/var BUILD="([^"]+)"/.exec(t);if(!m||m[1]===BUILD)return;
    var a=document.activeElement,typing=a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="checkbox"&&a.value));
    if(pending>0||typing||($("camwrap")&&!$("camwrap").classList.contains("hide")))return;
    var k="assiReload_"+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1")}catch(e){}
    location.reload()}).catch(function(){})}
setTimeout(checkUpdate,2500);
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,300000);
})();
